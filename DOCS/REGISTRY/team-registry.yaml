# ============================================================================
# TEAM REGISTRY MODULE — TCN Ikorodu Transport Booking & Management App
# Version: 1.0 | Status: CANONICAL — machine-readable team registry
# Purpose: every agent = a profile. Single registry for identity, mailbox,
#          ownership, reporting line, and delivery-lane assignment.
# Consumed by: AGENT-COMMUNICATIONS-WORKFLOW.md, CANONICAL-PROJECT-LIFECYCLE.yaml,
#              AGENTS.md bootstrap, any orchestration layer.
# Registry authority: Product Manager (vlthrlab-pm@agentmail.to)
# ============================================================================

registry:
  schema_version: "1.0"
  updated: "2026-10-07"
  project: TCN Ikorodu Transport Booking & Management App

# ----------------------------------------------------------------------------
# GOVERNANCE MODEL — registered from sponsor's org chart + SDLC swimlane
# ----------------------------------------------------------------------------
governance:

  # --- Org chart mapping -------------------------------------------------
  # Sponsor's chart: PO/BA -> PM/Scrum Master -> [Developers | UI/UX | QA] + DevOps (cross-lane)
  # Our model maps onto it 1:1; names differ, structure identical.
  hierarchy:
    - level: 1
      chart_title: "Product Owner / Business Analyst"
      maps_to: executive_product_sponsor
      note: "Executive product authority. In our model, final sponsor; PM carries PO/BA function operationally."
    - level: 2
      chart_title: "Project Manager / Scrum Master"
      maps_to: product_manager
      note: "Hub: coordination, decision arbitration, delivery gates. Secretary (Ufuoma) assists on onboarding/coordination traffic."
    - level: 3
      chart_title: "Delivery lanes"
      lanes:
        developers:  [frontend, backend, fullstack]   # chart's three dev specialisations
        design:      [uiux]
        qa:          [qa_manual, qa_auto]             # chart splits QA into Manual + Auto
        cross_lane:  [devops]                          # DevOps spans all lanes per chart
      note: "Our finer-grained roles (database, security, integrations, data_science, liaison, secretary) slot into lanes below per profile.lane."

  # --- SDLC swimlane (registered) -----------------------------------------
  # Product Manager: Define Requirements -> Prioritise Backlog
  # Design:          Create Wireframes   -> Develop Prototypes
  # Engineering:     Implement Features  -> Conduct Code Review
  # QA:              Perform Testing     -> Pass? -> Deploy & Monitor (pass)
  #                                        | Fail -> back to Implement Features
  delivery_flow:
    stages:
      - {id: define,      lane: product_manager, acts: [define_requirements, prioritise_backlog]}
      - {id: design,      lane: uiux,            acts: [create_wireframes, develop_prototypes]}
      - {id: engineer,    lane: developers,      acts: [implement_features, conduct_code_review]}
      - {id: qa_gate,     lane: qa,              acts: [perform_testing, pass_fail_gate]}
      - {id: deploy,      lane: devops,          acts: [deploy, monitor]}
    fail_loop: "QA fail returns to 'engineer' stage — never skips code review on the way back"
    overlays:   "our pre-SDLC gates still apply upstream: Gate 0 (OI-001 reconvene) before 'define' is complete for engineering"

  # --- Decision & escalation rights ---------------------------------------
  escalation_ladder:
    L1: "agent-to-agent [Q] thread — 48h working SLA"
    L2: "unresolved/disagreement -> [B] to PM -> PM arbitrates or opens OI"
    L3: "executive-level (budget, church policy, launch auth, direction) -> [E] to Sponsor via PM"
  reopen_rule: "REOPEN DECISION requires new evidence of material impact; PM decides whether reopened"
  tie_break: "D-012 — conflicting respondents reconvene; PM does NOT tie-break"

