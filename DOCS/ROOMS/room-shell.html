<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLTHRLAB Meeting Room</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --ink:#e8eaf0; --dim:#9aa3b2; --accent:#5b8cff; --closed:#2a2e38; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--panel); border-bottom:1px solid #252a35; padding:12px 20px; display:flex; gap:14px; align-items:baseline; z-index:2; }
  header h1 { font-size:16px; margin:0; }
  #status { margin-left:auto; font-size:12px; padding:3px 10px; border-radius:99px; background:#1f5130; }
  #status.closed { background:#5a2730; }
  #status.scheduled { background:#3a4a66; }
  main { display:grid; grid-template-columns:240px 1fr; max-width:1100px; margin:0 auto; padding:20px; gap:20px; }
  nav#toc { position:sticky; top:70px; align-self:start; font-size:13px; }
  nav#toc a { display:block; color:var(--dim); text-decoration:none; padding:5px 10px; border-left:2px solid transparent; }
  nav#toc a.sub { padding-left:26px; font-size:12px; }
  nav#toc a.active { color:var(--ink); border-left-color:var(--accent); }
  nav#toc a.seen { color:#5c6; }
  section.slide { background:var(--panel); border:1px solid #252a35; border-radius:10px; padding:26px 30px; margin-bottom:18px; }
  section.slide h2 { margin-top:0; font-size:19px; }
  section.slide h3 { font-size:15px; color:var(--accent); }
  #closed-banner { display:none; text-align:center; padding:60px 20px; background:var(--closed); border-radius:12px; margin:20px auto; max-width:640px; }
  #closed-banner h2 { font-size:26px; margin:0 0 8px; }
  #closed-banner .recap-link { display:inline-block; margin-top:16px; padding:10px 20px; background:var(--accent); color:#fff; border-radius:8px; text-decoration:none; }
  footer { text-align:center; color:var(--dim); font-size:12px; padding:24px; }
</style>
</head>
<body>
<header>
  <h1 id="room-title">Meeting Room</h1>
  <span id="agenda-meta"></span>
  <span id="status">CONNECTING</span>
</header>
<div id="closed-banner">
  <h2>Room Closed</h2>
  <p id="closed-summary"></p>
  <a class="recap-link" id="recap-link" href="#">View Meeting Recap</a>
</div>
<main id="room-body">
  <nav id="toc"></nav>
  <div id="content"></div>
</main>
<footer>VLTHRLAB · agent meeting room · context = sections/subsections of the loaded room document</footer>
<script>
/*
  Room shell. Loads room.json for this room's state + content path.
  State machine: scheduled -> open -> closed.
  - open:      renders sections; nav marks progress; chat channel active
  - closed:    renders Room Closed + links to public recap artifact (never 404)
  - scheduled: renders agenda + "not yet open" notice
  Polls status every 5s — no websockets needed at team scale.
*/
const ROOM_ID = new URLSearchParams(location.search).get("room") || "default";
const API = "./api";  // Cloudflare Worker mount point; static host fallback reads ./rooms/<id>/state.json

async function getState() {
  try { return await (await fetch(`${API}/rooms/${ROOM_ID}/state`)).json(); }
  catch { return await (await fetch(`rooms/${ROOM_ID}/state.json`)).json(); }  // static fallback
}

async function getContent(state) {
  const res = await fetch(state.content_url);
  return res.text(); // room HTML: <section data-title> blocks; <h3> => subsection
}

function renderTOC(root) {
  const toc = document.getElementById("toc");
  toc.innerHTML = "";
  root.querySelectorAll("section").forEach((sec, i) => {
    const a = document.createElement("a");
    a.href = `#s${i}`; a.textContent = sec.dataset.title || sec.querySelector("h2")?.textContent || `Section ${i+1}`;
    toc.appendChild(a);
    sec.querySelectorAll("h3").forEach(h => {
      const sub = document.createElement("a");
      sub.className = "sub"; sub.href = `#s${i}`; sub.textContent = h.textContent;
      toc.appendChild(sub);
    });
  });
}

function render(state, html) {
  const status = document.getElementById("status");
  status.textContent = state.status.toUpperCase();
  status.className = state.status;
  document.getElementById("room-title").textContent = state.title || "Meeting Room";
  document.getElementById("agenda-meta").textContent =
    `${state.chair || "PM"} · ${state.scheduled_for || ""}`;

  if (state.status === "closed") {
    document.getElementById("room-body").style.display = "none";
    const b = document.getElementById("closed-banner");
    b.style.display = "block";
    document.getElementById("closed-summary").textContent =
      state.closed_summary || `This meeting has ended.`;
    const r = document.getElementById("recap-link");
    if (state.recap_url) { r.href = state.recap_url; }
    else { r.style.display = "none"; }
    return;
  }

  const holder = document.createElement("div");
  holder.innerHTML = html;
  const content = document.getElementById("content");
  content.innerHTML = "";
  holder.querySelectorAll("section").forEach((sec, i) => {
    sec.classList.add("slide"); sec.id = `s${i}`;
    content.appendChild(sec);
  });
  renderTOC(content);
  if (state.status === "scheduled") {
    content.insertAdjacentHTML("afterbegin",
      `<section class="slide"><h2>Not yet open</h2><p>The chair will open this room at the scheduled time. Agenda is below.</p></section>`);
  }
}

let lastStatus = null;
async function tick() {
  try {
    const state = await getState();
    if (state.status !== lastStatus) {
      lastStatus = state.status;
      const html = state.status === "closed" ? "" : await getContent(state);
      render(state, html);
    }
  } catch (e) { /* transient; retry next tick */ }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
